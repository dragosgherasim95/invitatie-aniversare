<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitație aniversare</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f5f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- STILURI PENTRU PLICUL INTERACTIV --- */
        #envelopeScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            cursor: pointer;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .envelope {
            width: 320px;
            height: 220px;
            background: #e8e2d5;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d5cbb8;
        }

        /* Capacul plicului (triunghiul de sus) */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #dcd3c1;
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
            z-index: 3;
        }

        /* Sigiliul de pe plic */
        .envelope-seal {
            position: absolute;
            top: 95px;
            width: 50px;
            height: 50px;
            background: #b9853f;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 4;
            border: 2px solid #fff8eb;
            transition: transform 0.3s;
        }

        .envelope-seal:hover {
            transform: scale(1.1);
        }

        .envelope-text {
            margin-top: 20px;
            font-size: 16px;
            color: #b9853f;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse-label 1.5s infinite alternate;
        }

        /* Animație de deschidere plic */
        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        
        .envelope.open .envelope-seal {
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Animație de dispariție plic după deschidere */
        .fade-out {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        @keyframes pulse-label {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* --- ECRANUL DE INTRODUCERE A NUMELUI (Ascuns inițial) --- */
        #welcomeScreen {
            display: none;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            text-align: center;
            z-index: 30;
            animation: fadeIn 0.8s ease;
        }
        #welcomeScreen h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 22px;
        }
        #welcomeScreen p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .name-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .name-input:focus {
            border-color: #b9853f;
        }
        .btn-start {
            background-color: #b9853f;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start:hover {
            background-color: #9a6d31;
        }

        /* --- INVITAȚIA PROPRIU-ZISĂ --- */
        .card {
            display: none;
            background-color: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .personal-title {
            font-size: 20px;
            color: #b9853f;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        /* Pickup și Vinil în dreapta jos */
        .turntable-wrapper {
            position: absolute;
            bottom: 20px;
            right: -25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            cursor: pointer;
        }

        @media (max-width: 580px) {
            .turntable-wrapper {
                right: 10px;
                bottom: 15px;
            }
        }

        .turntable-label {
            font-size: 11px;
            font-weight: 700;
            color: #b9853f;
            background: #fff8eb;
            border: 1px solid #f0d5a8;
            padding: 2px 6px;
            border-radius: 6px;
            margin-bottom: 4px;
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: pulse-label 1.5s infinite alternate;
        }

        .turntable-container {
            width: 90px;
            height: 80px;
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            border: 2px solid #b9853f;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .turntable-platter {
            width: 62px;
            height: 62px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid #444;
        }

        .vinyl {
            width: 58px;
            height: 58px;
            background: radial-gradient(circle, #333 20%, #111 21%, #111 30%, #222 31%, #111 60%, #000 100%);
            border-radius: 50%;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .vinyl-center {
            width: 18px;
            height: 18px;
            background-color: #e74c3c;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .vinyl.spinning {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .tonearm {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 3px;
            height: 35px;
            background: #d4af37;
            border-radius: 2px;
            transform-origin: top right;
            transform: rotate(-30deg);
            transition: transform 0.5s ease-in-out;
            pointer-events: none;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .tonearm::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -2px;
            width: 8px;
            height: 5px;
            background: #888;
            border-radius: 2px;
        }
        .turntable-container.playing .tonearm {
            transform: rotate(8deg);
        }

        .power-knob {
            position: absolute;
            bottom: 5px;
            left: 6px;
            width: 6px;
            height: 6px;
            background: #b9853f;
            border-radius: 50%;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            background: #fff8eb;
            border: 1px solid #f0d5a8;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            margin-top: 10px;
        }
        .countdown-item { display: flex; flex-direction: column; }
        .countdown-num { font-size: 20px; font-weight: bold; color: #b9853f; }
        .countdown-label { font-size: 11px; color: #777; text-transform: uppercase; }
        .invitation-img {
            width: 100%; height: auto; border-radius: 12px; margin-bottom: 20px; display: block;
        }
        .button-group {
            display: flex; gap: 16px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; align-items: center;
        }
        .button-slot { display: flex; align-items: center; gap: 8px; }
        .btn {
            padding: 14px 28px; font-size: 17px; font-weight: 700; border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            outline: none; -webkit-tap-highlight-color: transparent; text-decoration: none; display: inline-block;
        }
        .btn-yes { background-color: #2ecc71; color: white; }
        .btn-yes:hover { background-color: #27ae60; transform: translateY(-2px); }
        .btn-no { background-color: #e74c3c; color: white; }
        .btn-no:hover { background-color: #c0392b; transform: translateY(-2px); }
        .response-message { font-size: 18px; font-weight: 600; color: #2c3e50; margin-top: 15px; }
        .silhouette { display: none; }
        .silhouette.show { display: flex; }
        .happy-bounce { animation: bounce 0.5s ease-in-out infinite alternate; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
        .balloon-container {
            position: fixed; bottom: -120px; left: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: hidden; z-index: 5;
        }
        .balloon {
            position: absolute; bottom: -100px; width: 50px; height: 65px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; animation: floatUp 4s linear forwards; opacity: 0.9;
        }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; } }
    </style>
</head>
<body>

    <!-- 1. ECRANUL CU PLICUL INTERACTIV -->
    <div id="envelopeScreen" onclick="openEnvelope()">
        <div id="envelope" class="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-seal">💌</div>
        </div>
        <div class="envelope-text">Apasă pentru a deschide plicul</div>
    </div>

    <!-- 2. ECRANUL DE INTRODUCERE A NUMELUI -->
    <div id="welcomeScreen">
        <h2>Bine ai venit!</h2>
        <p>Te rog introdu Numele și Prenumele tău pentru a continua:</p>
        <input type="text" id="guestNameInput" class="name-input" placeholder="Ex: Popescu Ion" autocomplete="name">
        <button class="btn-start" onclick="openInvitation()">Deschide Invitația</button>
    </div>

    <!-- 3. INVITAȚIA PROPRIU-ZISĂ -->
    <div class="card" id="invitationCard">
        <div id="personalGreeting" class="personal-title"></div>

        <!-- Numărătoare inversă -->
        <div class="countdown">
            <div class="countdown-item"><span id="days" class="countdown-num">00</span><span class="countdown-label">Zile</span></div>
            <div class="countdown-item"><span id="hours" class="countdown-num">00</span><span class="countdown-label">Ore</span></div>
            <div class="countdown-item"><span id="minutes" class="countdown-num">00</span><span class="countdown-label">Min</span></div>
            <div class="countdown-item"><span id="seconds" class="countdown-num">00</span><span class="countdown-label">Sec</span></div>
        </div>

        <!-- Imaginea din Git -->
        <img src="poza_invitatie.jpeg" alt="Invitație aniversare" class="invitation-img">

        <div class="button-group">
            <div class="button-slot">
                <div id="yesSilhouette" class="silhouette">
                    <svg id="svgLeft" width="65" height="90" viewBox="0 0 100 130"></svg>
                </div>
                <button class="btn btn-yes" onclick="respond(true)">Vin</button>
            </div>

            <div class="button-slot">
                <button class="btn btn-no" onclick="respond(false)">Nu vin</button>
                <div id="noSilhouette" class="silhouette">
                    <svg id="svgRight" width="65" height="90" viewBox="0 0 100 130"></svg>
                </div>
            </div>
        </div>

        <div id="message" class="response-message"></div>

        <!-- Pickup Dispozitiv cu Vinil în dreapta jos -->
        <div class="turntable-wrapper" onclick="toggleMusic()" title="Apasă pentru a porni muzica">
            <div class="turntable-label">▶ Play music</div>
            <div id="turntable" class="turntable-container">
                <div class="turntable-platter">
                    <div id="vinyl" class="vinyl">
                        <div class="vinyl-center"></div>
                    </div>
                </div>
                <div class="tonearm"></div>
                <div class="power-knob"></div>
            </div>
        </div>

        <!-- Audio Player -->
        <audio id="bgMusic" loop>
            <source src="La_multi_ani.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div id="balloonContainer" class="balloon-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
        const EVENT_DATE = new Date("2026-09-19T17:00:00").getTime();

        // Pasul 1: Deschide plicul și afișează ecranul de nume
        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            envelope.classList.add('open');

            setTimeout(() => {
                document.getElementById('envelopeScreen').style.display = 'none';
                document.getElementById('welcomeScreen').style.display = 'block';
            }, 700); // Trecerea se face lin după animația capacului
        }

        // Pasul 2: Preluare nume și afișare invitație
        function openInvitation() {
            const input = document.getElementById('guestNameInput');
            const name = input.value.trim();

            if (name === "") {
                alert("Te rog să introduci numele și prenumele înainte de a continua!");
                return;
            }

            document.getElementById('personalGreeting').innerText = `Invitație specială pentru ${name}`;
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('invitationCard').style.display = 'block';
        }

        // Control Muzică Vinil & Pickup
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const vinyl = document.getElementById('vinyl');
            const turntable = document.getElementById('turntable');

            if (music.paused) {
                music.play();
                vinyl.classList.add('spinning');
                turntable.classList.add('playing');
            } else {
                music.pause();
                vinyl.classList.remove('spinning');
                turntable.classList.remove('playing');
            }
        }

        // Countdown timer
        setInterval(() => {
            const now = new Date().getTime();
            const diff = EVENT_DATE - now;
            if (diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);

        function getLeftSadSVG() {
            return `<g transform="rotate(-10 50 60)"><circle cx="50" cy="20" r="14" fill="none" stroke="#b9853f" stroke-width="4"/><circle cx="43" cy="17" r="2" fill="#b9853f"/><circle cx="57" cy="17" r="2" fill="#b9853f"/><path d="M42 27 Q50 20 58 27" fill="none" stroke="#b9853f" stroke-width="3.5" stroke-linecap="round"/><rect x="36" y="38" width="28" height="30" fill="none" stroke="#b9853f" stroke-width="4"/><rect x="36" y="68" width="28" height="18" fill="none" stroke="#b9853f" stroke-width="3"/><line x1="50" y1="68" x2="50" y2="86" stroke="#b9853f" stroke-width="3"/><line x1="42" y1="86" x2="38" y2="118" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><line x1="58" y1="86" x2="62" y2="118" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><path d="M36 42 L24 60" fill="none" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><path d="M64 42 L76 60" fill="none" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/></g>`;
        }

        function getRightSadSVG() {
            return `<g transform="rotate(10 50 60)"><circle cx="50" cy="20" r="14" fill="none" stroke="#b9853f" stroke-width="4"/><circle cx="43" cy="17" r="2" fill="#b9853f"/><circle cx="57" cy="17" r="2" fill="#b9853f"/><path d="M42 27 Q50 20 58 27" fill="none" stroke="#b9853f" stroke-width="3.5" stroke-linecap="round"/><rect x="36" y="38" width="28" height="30" fill="none" stroke="#b9853f" stroke-width="4"/><rect x="36" y="68" width="28" height="18" fill="none" stroke="#b9853f" stroke-width="3"/><line x1="50" y1="68" x2="50" y2="86" stroke="#b9853f" stroke-width="3"/><line x1="42" y1="86" x2="38" y2="118" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><line x1="58" y1="86" x2="62" y2="118" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><path d="M36 42 L24 60" fill="none" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><path d="M64 42 L76 60" fill="none" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/></g>`;
        }

        function getHappySVG() {
            return `<g class="happy-bounce"><circle cx="50" cy="22" r="14" fill="none" stroke="#b9853f" stroke-width="4"/><circle cx="44" cy="18" r="2" fill="#b9853f"/><circle cx="56" cy="18" r="2" fill="#b9853f"/><path d="M42 26 Q50 32 58 26" fill="none" stroke="#b9853f" stroke-width="3" stroke-linecap="round"/><rect x="36" y="40" width="28" height="30" fill="none" stroke="#b9853f" stroke-width="4"/><rect x="36" y="70" width="28" height="18" fill="none" stroke="#b9853f" stroke-width="3"/><line x1="50" y1="70" x2="50" y2="88" stroke="#b9853f" stroke-width="3"/><line x1="42" y1="88" x2="38" y2="120" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><line x1="58" y1="88" x2="62" y2="120" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><path d="M36 44 L20 28 L15 20" fill="none" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><path d="M15 20 L12 14 M15 20 L18 15 M15 20 L11 22" stroke="#b9853f" stroke-width="2.5" stroke-linecap="round"/><path d="M64 44 L80 28 L85 20" fill="none" stroke="#b9853f" stroke-width="4" stroke-linecap="round"/><path d="M85 20 L88 14 M85 20 L82 15 M85 20 L89 22" stroke="#b9853f" stroke-width="2.5" stroke-linecap="round"/></g>`;
        }

        function respond(isComing) {
            const messageElement = document.getElementById('message');
            const svgLeft = document.getElementById('svgLeft');
            const svgRight = document.getElementById('svgRight');

            if (isComing) {
                messageElement.innerText = "Abia aștept să ne vedem! ❤️";
                svgLeft.innerHTML = getHappySVG();
                svgRight.innerHTML = getHappySVG();
                launchConfetti();
                createBalloons();
            } else {
                messageElement.innerText = "Am înțeles, vii, mulțumesc te aștept cu drag";
                svgLeft.innerHTML = getLeftSadSVG();
                svgRight.innerHTML = getRightSadSVG();
            }

            document.getElementById('yesSilhouette').classList.add('show');
            document.getElementById('noSilhouette').classList.add('show');
        }

        function launchConfetti() {
            if (typeof confetti !== 'function') return;
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function createBalloons() {
            const container = document.getElementById('balloonContainer');
            container.innerHTML = '';
            const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6'];
            for (let i = 0; i < 15; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = Math.random() * 90 + 5 + '%';
                balloon.style.animationDelay = (Math.random() * 1) + 's';
                container.appendChild(balloon);
            }
        }
    </script>
</body>
</html>
